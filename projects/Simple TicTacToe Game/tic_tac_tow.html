<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
        
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

        }

        .mainHeading{
            font-family: arial;
            font-size: 24px;
            text-decoration: underline;
            font-weight: bold;
        }

        .buttonDiv{
            margin: 40px;
        }

        .button{
    
            padding: 8px;
            border: 1px solid black;
            border-radius: 10px;
        }

        .grid{
        
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(3, 0fr);
            gap : 10;
            

        }

        .grid-box{

            display: flex;
            align-items: center;justify-content: center;
            height: 100px;width: 100px;
            border: 1px solid black;
            font-size: 28px;
            font-family: arial;
            font-weight: bold;

        }

        .grid-1, .grid-4, .grid-7, .grid-3, .grid-6, .grid-9{

            border-left: none;
            border-top: none;
            border-right: none;

        }

        .grid-7, .grid-8, .grid-9, .grid-2, .grid-5{

            border-bottom: none;

        }

        .grid-2{
            border-top: none;
        }

    </style>
</head>
<body>
    <div class="mainHeading">
        Tic Tac Toe Game
    </div>
    <div class="grid">
        <div class="grid-box row-1 column-1 diagonal-1 grid-1"></div>
        <div class="grid-box row-1 column-2 grid-2"></div>
        <div class="grid-box row-1 column-3 diagonal-2 grid-3"></div>
        <div class="grid-box row-2 column-1 grid-4"></div>
        <div class="grid-box row-2 column-2 diagonal-2 diagonal-1 grid-5"></div>
        <div class="grid-box row-2 column-3 grid-6"></div>
        <div class="grid-box row-3 column-1 diagonal-2 grid-7"></div>
        <div class="grid-box row-3 column-2 grid-8"></div>
        <div class="grid-box row-3 column-3 diagonal-1 grid-9"></div>

    </div>

    <div class="buttonDiv">
        <buttton class="buttonClass button">Start</buttton>
        <buttton class="restartButtonClass button">Restart</buttton>
    </div>

    <script src="tic_tac_toe.js"></script>
</body>
</html>
