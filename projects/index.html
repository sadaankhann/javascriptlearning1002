<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
        }

        .section-1 {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 5;
        }

        .grid-box {
            height: 100px;
            width: 100px;
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <section class="section-1">
        <div class="grid">
            <div class="grid-box row-1 column-1 diagonal-1 grid-1"></div>
            <div class="grid-box row-1 column-2 grid-2"></div>
            <div class="grid-box row-1 column-3 diagonal-2 grid-3"></div>
            <div class="grid-box row-2 column-1 grid-4"></div>
            <div class="grid-box row-2 column-2 diagonal-2 diagonal-1 grid-5"></div>
            <div class="grid-box row-2 column-3 grid-6"></div>
            <div class="grid-box row-3 column-1 diagonal-2 grid-7"></div>
            <div class="grid-box row-3 column-2 grid-8"></div>
            <div class="grid-box row-3 column-3 diagonal-1 grid-9"></div>
        </div>
        <div class="result">
            <p class="resultText">Result</p>
        </div>
    </section>

    <script src="ticTacToe-Beta-Test.js"></script>
</body>

</html>
