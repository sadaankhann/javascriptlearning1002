<body>
    <script>

        let ask_User1 = prompt("Enter the first number: ");
        let ask_User2 = prompt("Enter the second number: ");
    
        if (isNaN(ask_User1) || isNaN(ask_User2)) {
            throw SyntaxError("Please enter numbers only!");
        }
        else {
            let sum = parseInt(ask_User1) + parseInt(ask_User2);
            console.log(sum);
        }

        //or

        try{

           let calculation = x/2;

        }


    </script>
